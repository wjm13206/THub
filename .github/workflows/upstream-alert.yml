name: Upstream Commit Alert

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read last alert SHA
        id: last
        run: |
          SHA=$(cat .last-alert-sha 2>/dev/null || echo "")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream commits and filter new ones
        id: commits
        run: |
          curl -sf "https://api.atomgit.com/api/v5/repos/Furrycalin/ChronixHub/commits?sha=main&per_page=30" \
            -o /tmp/upstream.json || { echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; }

          LAST_SHA="${{ steps.last.outputs.sha }}"
          if [ -z "$LAST_SHA" ]; then
            jq '[.[0]]' /tmp/upstream.json > /tmp/new.json
          else
            jq --arg sha "$LAST_SHA" '
              . as $all
              | ([$all[] | .sha] | index($sha)) as $idx
              | if $idx then $all[:$idx] else $all end
            ' /tmp/upstream.json > /tmp/new.json
          fi

          echo "count=$(jq 'length' /tmp/new.json)" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r '.[0].sha // empty' /tmp/new.json)" >> "$GITHUB_OUTPUT"
          cp /tmp/new.json /tmp/alert-commits.json

      - name: Check for open alert issue
        id: existing
        if: steps.commits.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh issue list --label "upstream-batch" --state open --json number --jq '.[0].number // empty')
          echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        if: steps.commits.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "upstream-batch" --description "上游新提交待适配" --color "f78c26" 2>/dev/null || true

      - name: Append to existing issue
        if: steps.commits.outputs.count > 0 && steps.existing.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "哼，坏蛋，上次说的你都还没改！上游又有 ${{ steps.commits.outputs.count }} 个新提交了："
            echo ""
            jq -r '.[:10] | .[] | "- [\(.commit.message | split("\n")[0])](\(.html_url))"' /tmp/alert-commits.json
          } | gh issue comment "${{ steps.existing.outputs.issue_number }}" --body-file -
          echo "${{ steps.commits.outputs.latest }}" > .last-alert-sha

      - name: Create new issue
        if: steps.commits.outputs.count > 0 && steps.existing.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "自上次提醒后，上游新增了 ${{ steps.commits.outputs.count }} 个提交："
            echo ""
            jq -r '.[:10] | .[] | "- [\(.commit.message | split("\n")[0])](\(.html_url))"' /tmp/alert-commits.json
            echo ""
            echo "请评估是否需要适配。"
          } | gh issue create \
            --title "上游 ${{ steps.commits.outputs.count }} 个新提交待适配" \
            --body-file - > /tmp/issue-url.txt
          NUM=$(grep -oE '[0-9]+$' /tmp/issue-url.txt)
          gh issue edit "$NUM" --add-label "upstream-batch" 2>/dev/null || true
          echo "${{ steps.commits.outputs.latest }}" > .last-alert-sha
